on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: pkgcheck

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgcheck
          needs: check
      - name: Run pkgcheck
        shell: Rscript {0}
        run: |
          chk <- pkgcheck::pkgcheck()
          print(chk)
          pkgcheck::pkgcheck_to_md(chk)
